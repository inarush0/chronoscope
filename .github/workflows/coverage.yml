# Reports coverage. It does not enforce it.
#
# The 80% figure in the summary is a goal to climb toward, not a gate: this job
# is non-blocking *structurally*, by not being on any required-checks list,
# rather than by a `continue-on-error` flag someone could flip. (As of writing
# the repo has no branch protection at all, so nothing gates any merge; if that
# changes, this job must stay off the required list.) A red check here is still
# real signal — it means the tests or the build broke, which build.yml will be
# saying too.
#
# Go and TypeScript are reported as two numbers, never blended: a healthy Go
# percentage would otherwise mask a thin TypeScript one. They must be written
# from a *single job* — GitHub orders multi-job step summaries by completion
# time, so two jobs would swap places between runs.
#
# Deliberately self-hosted: a job summary plus an artifact, no Codecov or
# equivalent. No external account, no CI secret, no coverage data leaving the
# repo.
name: coverage

on:
  push:
    branches: [main]
  pull_request:

jobs:
  report-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # cache: false for the same reason build.yml gives — there is no go.sum
      # to key a cache on, and setup-go warns when it globs for one and finds
      # nothing.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install dependencies
        run: npm ci

      # Part of the TypeScript suite runs in headless Chromium under Vitest
      # browser mode (#42/#63) — TimelineController cannot be constructed
      # without a real canvas. Uncached, downloading the browser is the
      # dominant cost of a job otherwise measured at 46s, hence the cache.
      #
      # Keyed on the resolved playwright version rather than the lockfile
      # hash, because the browser build only changes when that package does
      # and any other dependency bump would needlessly evict it. `playwright`
      # is a declared devDependency precisely so this read and the `npx`
      # invocation below both resolve something the lockfile pins — as an
      # undeclared transitive it would be a hoisting change away from failing.
      - name: Resolve the Playwright version for the cache key
        id: pw
        run: |
          version="$(node -p "require('playwright/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      # --with-deps installs the apt packages headless Chromium needs. Every
      # measurement behind the browser-mode decision was made on darwin/arm64,
      # so this is the first time it runs on the ubuntu runner; if the apt
      # payload does not install cleanly, report it on #52's map thread rather
      # than switching to jsdom, which #42 ruled against on the merits.
      #
      # Runs even on a cache hit: the cache carries the browser under HOME,
      # not the system libraries it links against.
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      # `npm run build`, not `build:binary`: `go test` needs dist/ to exist for
      # `//go:embed all:dist` to compile, and nothing here runs the binary. The
      # Vite build takes about a second, which is cheaper than importing
      # build.yml's dist/ as an artifact — that would cost a `needs:` edge and
      # skip coverage entirely whenever the gating job failed.
      - name: Build the frontend so `//go:embed all:dist` can compile
        run: npm run build

      # Both measurement steps continue past a failing test on purpose: a red
      # suite is exactly when the numbers are worth reading, and both tools
      # still emit a complete report when tests fail. (`go help testflag` claims
      # the profile is only written once tests pass; measured on go1.27, that is
      # stale.)
      - name: Measure TypeScript coverage
        id: ts
        continue-on-error: true
        run: npm run coverage

      - name: Measure Go coverage
        id: go
        continue-on-error: true
        run: |
          # Held rather than propagated on the spot, and handed back by the
          # last line. The step runs under `bash -e`, so a failing `go test`
          # would otherwise abort before the filter — and a red suite is
          # exactly when the profile it did write is worth reading.
          status=0
          go test -coverprofile="$RUNNER_TEMP/go-cover.raw" ./... || status=$?

          # main.go leaves the denominator; ADR-0003 has the argument. A Go
          # profile is per-block by line range with no per-function exclusion,
          # which is why main.go holds nothing but main() — the filter can then
          # be a path grep rather than hardcoded line numbers. Everything
          # downstream reads the filtered profile, so -func, -html and the
          # summary all agree.
          #
          # The grep is by basename, so a second entrypoint added later (a
          # cmd/*/main.go) would leave the denominator silently along with it.
          #
          # Guarded so the redirect cannot invent a go-cover.out the summary
          # would then report on. (Measured: a compile failure still leaves a
          # header-only raw profile, which `-func` reads as a cheerful 0.0%
          # — that is pre-existing and unchanged here, not something the
          # filter introduces.)
          if [ -s "$RUNNER_TEMP/go-cover.raw" ]; then
            awk '/^mode:/ { print; next } !/\/main\.go:/' \
              "$RUNNER_TEMP/go-cover.raw" > "$RUNNER_TEMP/go-cover.out"
          fi

          # Into coverage/ so one artifact carries both languages. `go tool
          # cover -html` writes a single self-contained file, so it travels and
          # opens offline. mkdir because a TypeScript step that died before
          # writing anything leaves no coverage/ to write into.
          mkdir -p coverage
          if [ -s "$RUNNER_TEMP/go-cover.out" ]; then
            go tool cover -html="$RUNNER_TEMP/go-cover.out" -o coverage/go-coverage.html
          fi

          exit "$status"

      # The two tables are not the same shape and the summary does not pretend
      # they are: istanbul-reports has no per-function reporter, so the
      # TypeScript table is row-per-file where `go tool cover -func` is
      # row-per-function.
      #
      # `go tool cover` has only -func and -html — no JSON — so the Go table is
      # reshaped from -func text. Its columns are separated by *runs* of tabs,
      # the total: line has a different field count from the body rows, and the
      # file column carries the full module import path, which is noise inside
      # its own repo.
      - name: Write the job summary
        run: |
          ts_pct="n/a"
          if [ -f coverage/coverage-summary.json ]; then
            ts_pct="$(node -e 'process.stdout.write(String(require("./coverage/coverage-summary.json").total.statements.pct))')%"
          fi

          go_pct="n/a"
          if [ -f "$RUNNER_TEMP/go-cover.out" ]; then
            go_pct=$(go tool cover -func="$RUNNER_TEMP/go-cover.out" | awk -F'\t+' '/^total:/ { print $NF }')
          fi

          {
            echo "## Coverage"
            echo
            echo "Statements covered, against a goal this job displays and does not enforce."
            echo
            echo "| Language | Statements | Goal |"
            echo "| --- | ---: | ---: |"
            echo "| Go | ${go_pct} | 80% |"
            echo "| TypeScript | ${ts_pct} | 80% |"
            echo
            echo "Both numbers exclude their entrypoint — \`main.go\` on the Go side,"
            echo "\`src/main.ts\` on the TypeScript side — as shell wiring whose bugs"
            echo "are integration bugs a unit test would not catch. Neither is"
            echo "untested by accident. (\`src/test-support/\` is out for a different"
            echo "reason: it is test scaffolding, not production code.) ADR-0003 has"
            echo "the argument for all three."
            echo
            echo "### Go, by function"
            echo
            if [ -f "$RUNNER_TEMP/go-cover.out" ]; then
              echo "| Function | File:line | Coverage |"
              echo "| --- | --- | ---: |"
              go tool cover -func="$RUNNER_TEMP/go-cover.out" | awk -F'\t+' '
                /^total:/ { next }
                { loc = $1; sub(/:$/, "", loc); sub(/^.*\//, "", loc)
                  printf "| `%s` | `%s` | %s |\n", $2, loc, $3 }'
            else
              echo "_No profile produced — the Go step failed before writing one._"
            fi
            echo
            echo "### TypeScript, by file"
            echo
            if [ -f coverage/coverage.txt ]; then
              echo '```'
              cat coverage/coverage.txt
              echo '```'
            else
              echo "_No report produced — the TypeScript step failed before writing one._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # An agent reproducing this table locally will not get this table.
          # Vitest 4.1 detects AI agents (CLAUDECODE / CLAUDE_CODE / AI_AGENT
          # via std-env) and silently turns on `skipFull`, dropping every
          # fully-covered file from the text report. CI is unaffected.

      # if-no-files-found: error rather than the default warn — a run that
      # produced no report at all is precisely the failure this job exists to
      # surface, and the default would hide it behind a green check.
      - name: Upload the browsable reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

      # The measurement steps swallow their own failures so the summary always
      # gets written; this hands the failure back, so a broken suite is still a
      # red check. It is the last step on purpose.
      - name: Fail if either suite failed
        if: steps.ts.outcome == 'failure' || steps.go.outcome == 'failure'
        run: |
          echo "TypeScript: ${{ steps.ts.outcome }}, Go: ${{ steps.go.outcome }}" >&2
          echo "Coverage was still reported above; the suite itself failed." >&2
          exit 1
