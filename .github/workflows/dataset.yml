# dataset/events/*.json is the source of truth; static/chronoscope.json is a
# committed build artifact. Nothing else stops the two drifting apart, so this
# rebuilds and compares. The comparison is a plain byte diff — JSON, unlike the
# SQLite file this replaced, encodes the same data the same way every time.
name: dataset

on:
  push:
    branches: [main]
  pull_request:

jobs:
  artifact-is-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate the authored event files
        run: bun run validate

      - name: Fail if the committed artifact is stale
        run: bun run check:artifact
