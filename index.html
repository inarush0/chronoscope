    <title>Chronoscope</title>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>

    <!--
      BibleGateway Reference Tagging Tool. This is deliberate, not incidental:
      the NRSV/NRSVUE text is under copyright, so the app stores only event
      titles, summaries, and references — never verse text. BGLinks turns each
      plain-text reference into a link whose pop-over is served by BibleGateway,
      so the passage is displayed under their license rather than ours.

      Do not replace this by inlining scripture into the dataset or the UI.
    -->
    <script src="https://www.biblegateway.com/public/link-to-us/tooltips/bglinks.js"></script>
    <script>
      BGLinks.version = "NRSVUE";
      BGLinks.linkVerses();
    </script>
  </body>
</html>
